server:
  port: 8082

spring:
  application:
    name: rf-contract-svc
  cloud:
    config:
      uri: ${RF_CONFIG_SERVICE_URL:http://localhost:8888}

eureka:
  instance:
    hostname: ${RF_CONTRACT_SVC_HOSTNAME:localhost}
  client:
    serviceUrl:
      defaultZone: ${RF_EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

